name: AWS tests

on:
  workflow_call:
    inputs:
      stack-name: { required: true, type: string }
      aws-region: { required: false, type: string }

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-tests-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: AWS
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Pull repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

        with:
          cache: npm

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Run tests
        uses: govuk-one-login/github-actions/node/run-script@b5f4f92a0692bf297b08c43745e545e45631f0ee
        env:
          STACK_NAME: ${{ inputs.stack-name }}
          AWS_REGION: ${{ inputs.aws-region }}
        with:
          working-directory: integration-tests
          script: npm run test:aws

name: Mocked tests

on:
  workflow_call:

concurrency:
  group: mocked-tests-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  run-tests:
    name: Mocked
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        uses: govuk-one-login/github-actions/node/run-script@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          working-directory: integration-tests
          script: npm run test:mocked
